[package]
name = "state-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Namespace HTTP hosting and shared async execution for StateMCP"

[dependencies]
state-core = { path = "../state-core" }
state-contract = { path = "../state-contract" }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tar = "0.4"
futures-util = "0.3"
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
tracing = "0.1"

[dev-dependencies]
state-fs = { path = "../state-fs" }
state-store = { path = "../state-store" }
state-domain = { path = "../state-domain" }
