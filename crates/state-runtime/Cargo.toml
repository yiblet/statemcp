[package]
name = "state-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Embedded Monty execution and JSON host boundary for State MCP"
license = "MIT"

[dependencies]
monty = "=1.0.0"
monty-types = "=1.0.0"
monty-alloc = { version = "=1.0.0", features = ["exit-code"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
