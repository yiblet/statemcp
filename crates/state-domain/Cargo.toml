[package]
name = "state-domain"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Namespace, virtual file, function, and SQL domain operations over state-store"

[dependencies]
state-store = { path = "../state-store" }
state-migrations = { path = "../state-migrations" }
state-contract = { path = "../state-contract" }
base64 = "0.22"
rusqlite = { version = "0.38", features = ["bundled", "hooks", "limits", "extra_check"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

tracing = "0.1"
