[package]
name = "state-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Transactional State MCP service and Monty host APIs"

[dependencies]
state-store = { path = "../state-store" }
state-runtime = { path = "../state-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jsonschema = { version = "0.56", default-features = false }

[dev-dependencies]
tempfile = "3"
