[package]
name = "state-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Stateful agent APIs with virtual files, SQLite, and Monty"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
state-runtime = { path = "crates/state-runtime" }

[workspace]
members = ["crates/*"]
resolver = "3"
