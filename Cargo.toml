[package]
name = "statemcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Stateful agent APIs with virtual files, SQLite, and Monty"
license = "MIT"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros"] }
subtle = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
state-core = { path = "crates/state-core" }
state-runtime = { path = "crates/state-runtime" }

[workspace]
members = ["crates/*"]
resolver = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
